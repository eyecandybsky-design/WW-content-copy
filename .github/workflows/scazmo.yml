name: Scazmo Media Copy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scazmo media copy
        env:
          BSKY_USERNAME: scazmo.bsky.social
          BSKY_PASSWORD: ${{ secrets.SCAZMO_PASSWORD }}
        run: scazmo_media.py

      - name: Save Scazmo media history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f scazmo_state.json ]; then
            git add scazmo_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Scazmo media history"
              git push
            fi
          else
            echo "scazmo_state.json not found; nothing to commit."
          fi
