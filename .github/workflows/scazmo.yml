name: scazmo Media

on:
  workflow_dispatch:
 

jobs:
  repost-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto

      - name: Run Tullageback Media
        env:
          SOURCE_ACCOUNT: scazmo.bsky.social
          BSKY_USERNAME: snarlup.bsky.social
          BSKY_SNARLUP_PASSWORD: ${{ secrets.BSKY_SNARLUP_PASSWORD }}
          STATE_FILE: tullageback_media_state.json
          MIN_AGE_DAYS: "14"
          MAX_PAGES: "30"
          MAX_POSTS: "3"
        run: python tullageback_media.py

      - name: Save publication state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Tullageback media state"
          file_pattern: tullageback_media_state.json