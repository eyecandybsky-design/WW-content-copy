
name: WomenWorld Media

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: womenworld-media
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Publish one old media post
        env:
          BSKY_USERNAME: womenworld.bsky.social
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}

          SOURCE_ACCOUNT: tullageback.bsky.social

          STATE_FILE: womenworld_state.json

          MIN_AGE_DAYS: '30'
          MAX_PAGES: '30'
          MAX_POSTS: '1'

          DRY_RUN: 'false'

        run: |
          python womenworld_media.py

      - name: Persist published history
        if: success()
        run: |
          if [ -f womenworld_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add womenworld_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update WomenWorld media history"
              git push
            fi
          fi
