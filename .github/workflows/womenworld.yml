name: WomenWorld media test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Publish one old media post
        env:
          BSKY_USERNAME: womenworld.bsky.social
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          SOURCE_ACCOUNT: tullageback.bsky.social
          MIN_AGE_DAYS: '30'
          MAX_POSTS: '1'
          MAX_PAGES: '30'
        run: python womenworld_media.py
      - name: Persist published history
        run: |
          if [ -f womenworld_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add womenworld_state.json
            git diff --cached --quiet || (git commit -m 'Update WomenWorld media history' && git push)
