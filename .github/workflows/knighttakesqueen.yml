
name: KnightTakesQueen Backup Autopost

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knighttakesqueen-backup
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Publish old media posts
        env:
          BSKY_USERNAME: knighttakesqueen.bsky.social
          BSKY_PASSWORD: ${{ secrets.KNIGHTTAKESQUEEN_PASSWORD }}

          SOURCE_ACCOUNT: thepriapicknave.bsky.social

          STATE_FILE: knighttakesqueen_state.json

          MIN_AGE_DAYS: '30'
          MAX_PAGES: '100'
          MAX_POSTS: '3'

        run: |
          python knighttakesqueen_media.py

      - name: Persist published history
        if: success()
        run: |
          if [ -f knighttakesqueen_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add knighttakesqueen_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update KnightTakesQueen media history"
              git push
            fi
          fi
