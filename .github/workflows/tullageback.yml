
name: Tullageback Random Media Autopost

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tullageback-media-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto requests

      - name: Run Tullageback autopost
        env:
          SOURCE_ACCOUNT: scazmo.bsky.social
          BSKY_USERNAME: snarlup.bsky.social
          BSKY_PASSWORD: ${{ secrets.BSKY_SNARLUP_PASSWORD }}
          STATE_FILE: tullageback_media_state.json
          MIN_AGE_DAYS: "30"
          MAX_PAGES: "20"
          MAX_CANDIDATES: "500"
        run: python tullageback_media.py

      - name: Persist published history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tullageback_media_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Tullageback media history"
            git pull --rebase origin main
            git push
          else
            echo "No state changes to save."
          fi
