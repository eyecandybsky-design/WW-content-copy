name: KnightTakesQueen Reposter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knighttakesqueen-reposter
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run KnightTakesQueen reposter
        env:
          BSKY_USERNAME: knighttakesqueen.bsky.social
          BSKY_PASSWORD: ${{ secrets.KNIGHTTAKESQUEEN_PASSWORD }}
          STATE_FILE: knighttakesqueen_reposter_state.json
        run: |
          python knighttakesqueen_reposter.py

      - name: Persist repost history
        if: success()
        run: |
          if [ -f knighttakesqueen_reposter_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add knighttakesqueen_reposter_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update KnightTakesQueen repost history"
              git push
            fi
          fi
